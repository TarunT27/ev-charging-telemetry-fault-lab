[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "ev-charging-telemetry-fault-lab"
version = "1.0.0"
description = "Deterministic EV charging telemetry fault injection, diagnostics, and offline reporting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tarun T" }]
keywords = ["ev-charging", "telemetry", "fault-injection", "reliability", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click>=8.3.3,<9",
  "fastapi>=0.136.3,<1",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.48,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.7,<3",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
ev-fault-lab = "telemetry_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["telemetry_lab"]
artifacts = ["telemetry_lab/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["telemetry_lab"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
omit = ["telemetry_lab/__main__.py"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["uvicorn"]
ignore_missing_imports = true
