<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">EV telemetry fault lab architecture</title>
  <desc id="desc">A virtual charger and controller pass immutable status messages through seeded fault injection, diagnostics, bounded recovery verification, and three delivery surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111b"/><stop offset="1" stop-color="#102535"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65e3c4"/><stop offset="1" stop-color="#86a7ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#65e3c4"/></marker>
    <style>
      .title{fill:#eaf5f4;font:700 28px system-ui,sans-serif}.sub{fill:#8ca4b5;font:14px system-ui,sans-serif}.label{fill:#eaf5f4;font:700 16px system-ui,sans-serif}.small{fill:#8ca4b5;font:12px system-ui,sans-serif}.tag{fill:#65e3c4;font:700 10px ui-monospace,monospace;letter-spacing:1.4px}.box{fill:#0d1b28;stroke:#29485d;stroke-width:1.5}.flow{fill:none;stroke:#65e3c4;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="60" r="250" fill="#174556" opacity=".18"/>
  <text x="60" y="62" class="tag">DETERMINISTIC RELIABILITY PIPELINE</text>
  <text x="60" y="102" class="title">From virtual charger signal to verified safe recovery</text>
  <text x="60" y="130" class="sub">Every stage is local, bounded, immutable, and replayable from a fixed seed.</text>

  <g transform="translate(60 195)"><rect width="190" height="160" rx="18" class="box"/><circle cx="40" cy="40" r="15" fill="#65e3c4" opacity=".2"/><path d="M32 40h16M40 32v16" stroke="#65e3c4" stroke-width="2"/><text x="24" y="82" class="label">Virtual charger</text><text x="24" y="108" class="small">State · power · health</text><text x="24" y="130" class="small">Controller diagnostics</text></g>
  <path d="M250 275H300" class="flow"/>
  <g transform="translate(300 195)"><rect width="190" height="160" rx="18" class="box"/><circle cx="40" cy="40" r="15" fill="#f06f7c" opacity=".2"/><path d="M33 33l14 14M47 33L33 47" stroke="#f06f7c" stroke-width="2"/><text x="24" y="82" class="label">Fault injection</text><text x="24" y="108" class="small">9 fault modes</text><text x="24" y="130" class="small">Seeded ground truth</text></g>
  <path d="M490 275H540" class="flow"/>
  <g transform="translate(540 195)"><rect width="190" height="160" rx="18" class="box"/><circle cx="40" cy="40" r="15" fill="#f5b557" opacity=".2"/><path d="M32 43l6 6 11-17" fill="none" stroke="#f5b557" stroke-width="2"/><text x="24" y="82" class="label">Diagnostics</text><text x="24" y="108" class="small">10 explainable checks</text><text x="24" y="130" class="small">Exact fault matching</text></g>
  <path d="M730 275H780" class="flow"/>
  <g transform="translate(780 195)"><rect width="190" height="160" rx="18" class="box"/><circle cx="40" cy="40" r="15" fill="#86a7ff" opacity=".2"/><path d="M31 48V39m9 9V31m9 17V35" stroke="#86a7ff" stroke-width="3"/><text x="24" y="82" class="label">Safe recovery</text><text x="24" y="108" class="small">Retry · reconnect</text><text x="24" y="130" class="small">Inhibit · validate · resume</text></g>
  <path d="M970 275H1020" class="flow"/>
  <g transform="translate(1020 176)"><rect width="130" height="198" rx="18" fill="#102737" stroke="url(#mint)" stroke-width="1.5"/><text x="20" y="44" class="tag">DELIVER</text><text x="20" y="78" class="label">Dashboard</text><text x="20" y="112" class="label">CLI + CSV</text><text x="20" y="146" class="label">JSON API</text><circle cx="20" cy="174" r="4" fill="#65e3c4" filter="url(#glow)"/><text x="32" y="179" class="small">offline-ready</text></g>

  <g transform="translate(60 430)"><rect width="1090" height="70" rx="14" fill="#091722" stroke="#203a4f"/><text x="24" y="28" class="tag">SAFETY CONTRACT</text><text x="24" y="50" class="small">Synthetic data only</text><text x="220" y="50" class="small">No charger command path</text><text x="450" y="50" class="small">No external services</text><text x="650" y="50" class="small">Bounded workloads</text><text x="840" y="50" class="small">Escaped offline reports</text></g>
</svg>
