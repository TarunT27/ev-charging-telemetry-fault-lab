name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy telemetry_lab
      - run: pytest --cov=telemetry_lab --cov-branch --cov-report=term-missing --cov-report=xml
      - run: pip-audit --requirement requirements.lock
      - run: pip-audit --requirement requirements-build.lock
      - name: CLI smoke test
        run: python -m telemetry_lab demo --output-dir /tmp/ev-fault-lab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage
          path: coverage.xml

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - run: docker build -t ev-fault-lab:ci .
      - run: docker run -d --name ev-fault-lab -p 8000:8000 ev-fault-lab:ci
      - name: Wait for health endpoint
        run: |
          for attempt in {1..20}; do
            curl --fail http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs ev-fault-lab
          exit 1
